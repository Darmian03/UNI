<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация на домашен любимец</title>
    <link rel="stylesheet" href="Form.css">
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="dog.png" alt="Dog photo">
        </div>

        <div class="form-container">
            <h1>Register your puppy!</h1>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Pet's name" required>

                <button type="button" class="upload-btn">Upload Photo</button>

                <label for="breed">Breed</label>
                <select id="breed" name="breed" required>
                    <option value="">Choose a breed</option>
                    <option>Golden Retriever</option>
                    <option>Labrador</option>
                    <option>Beagle</option>
                    <option>German Shepherd</option>
                    <option>Poodle</option>
                </select>

                <label for="birthday">Birthday</label>
                <input type="date" id="birthday" name="birthday" required>

                <label>Gender</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="female" required> Female</label>
                    <label><input type="radio" name="gender" value="male"> Male</label>
                </div>

                <label for="weight">Weight (lbs)</label>
                <input type="number" id="weight" name="weight" placeholder="Enter weight" min="0" required>

                <div class="buttons">
                    <button type="button" class="nav-btn back">Back</button>
                    <button type="button" class="nav-btn next">Next</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
