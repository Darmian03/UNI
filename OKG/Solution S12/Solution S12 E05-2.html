<html>
	<head>
		<style>
			body { margin: 0; }
			canvas { width: 100%; height: 100% }
		</style>
	</head>
	<body>
		<script src="three.min.js"></script>
		<script src="VideoTexture.js"></script>
		<video id="video" autoplay muted loop playsinline style="display:none">
			<source src="tv.mp4" type='video/mp4'>
		</video>
		
		<button style="margin: 1em; position:fixed; z-index:1000;" onclick="video.play()">Старт на видеото</button>
		
		<script>
			// Задача: Използвайте видео за динамична промяна
			// на релефа на куб
			
	
			var renderer = new THREE.WebGLRenderer( {antialias: true} );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );
			
			var scene = new THREE.Scene();
			scene.background = new THREE.Color( 'tan' );

			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( 0, 0, 25 );
			
			video = document.getElementById( 'video' );
			texture = new THREE.VideoTexture( video );
			texture.minFilter = THREE.LinearFilter;
			texture.magFilter = THREE.LinearFilter;
			texture.format = THREE.RGBFormat;

			// тук вече е лесно, видеотекстурата закачаме за
			// displacemetMap, но е добре преди това да
			// направим кубът да е доста детайлен, с много
			// вътрешни върхове по стените си
			var cube = new THREE.Mesh(
				new THREE.BoxGeometry( 6, 6, 6, 128, 128, 128 ),
				new THREE.MeshPhongMaterial({
					map: texture,
					color: 'darkred',
					bumpMap: texture,
					bumpScale: 0.1,
					specularMap: texture,
					displacementMap: texture,
					displacementScale: 3,
					shininess: 30,
					specular: 'white'
				})
			);
			scene.add(cube);
			
	
			var light = new THREE.AmbientLight( 'lightgray' );
			scene.add( light );
			
			light = new THREE.PointLight( 'white' );
			light.position.set( 0, 0, 9 );
			scene.add( light );
			
			light = new THREE.PointLight( 'white' );
			light.position.set( 9, 0, 9 );
			scene.add( light );
			
			light = new THREE.PointLight( 'white' );
			light.position.set( -9, 0, 9 );
			scene.add( light );
			
			function drawFrame()
			{
				cube.rotation.x += 0.003;
				cube.rotation.y += 0.002;
				cube.rotation.z += 0.001;
				
				renderer.render( scene, camera );
			}
		</script>
	</body>
</html>
