<html>
	<head>
		<style>
			body { margin: 0; }
			canvas { width: 100%; height: 100% }
		</style>
	</head>
	<body>
		<script src="three.min.js"></script>
		<script>
            //don't touch
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( -5, 3, 8 );
			camera.lookAt( new THREE.Vector3() );


            //SCENE
            var scene = new THREE.Scene();
            scene.background = new THREE.Color( 'rgb(173,216,230)' );
            brown = new THREE.MeshLambertMaterial( {color:'brown', side: THREE.DoubleSide} );
            white = new THREE.MeshLambertMaterial( {color:'white', side: THREE.DoubleSide} );
            blue = new THREE.MeshPhongMaterial( {color:'blue', side:THREE.DoubleSide} );


            //BODY
            var body = new THREE.Group();

            geometry = new THREE.CylinderGeometry( 4, 4, 10, 32, 32, true, Math.PI, Math.PI );
			cylinder = new THREE.Mesh( geometry, brown );
            cylinder.rotation.set(0,0,Math.PI/2);
			body.add( cylinder );

            geometry = new THREE.PlaneGeometry(10, 8);
            deck = new THREE.Mesh( geometry, brown );
            deck.rotation.set(Math.PI/2, 0,0);
            body.add( deck );

            var headfront = new THREE.Group();

            geometry = new THREE.SphereGeometry(4, 16, 16, 0, Math.PI, 0, Math.PI/2 );
			head1 = new THREE.Mesh( geometry, brown );
            head1.position.set( -5, 0, 0);
            head1.rotation.set(0,Math.PI*3/2,Math.PI);
			headfront.add( head1 );

            geometry = new THREE.RingGeometry( 0, 4, 32, 32, Math.PI/2, Math.PI); 
            headDeck1 = new THREE.Mesh( geometry, brown );
            headDeck1.position.set( -5, 0, 0);
            headDeck1.rotation.set(Math.PI/2, Math.PI, Math.PI);
            headfront.add( headDeck1 );

            headback = headfront.clone();
            headback.rotation.set(0, Math.PI, 0);

            body.add( headfront );
            body.add( headback );


            //MAST
            var mast = new THREE.Group();

            geometry = new THREE.CylinderGeometry( 0.5, 0.5, 14, 32, 32);
			pole = new THREE.Mesh( geometry, brown );
			mast.add( pole );

            geometry = new THREE.CylinderGeometry( 0.5, 0.5, 10, 32, 32);
			pole1 = new THREE.Mesh( geometry, brown );
            pole1.position.set( 0, 5, 0);
            pole1.rotation.set(0, Math.PI/2, Math.PI/2);
			mast.add( pole1 );

            pole2 = pole1.clone();
            pole1.position.set( 0, -5, 0);
            mast.add( pole2);

            //знам че според вятъра трябва да е наобратно
            geometry = new THREE.PlaneGeometry(3, 2);
            flag = new THREE.Mesh( geometry, white );
            flag.position.set( 2, 6, 0);
            mast.add( flag );

            //                                                               30 мин докато го наместя тва
            geometry = new THREE.CylinderGeometry( 10, 10, 10, 32, 32, true, Math.PI*2.66/2, Math.PI/3 );
            canvas = new THREE.Mesh( geometry, white );
            canvas.position.set( 8.2, 0, 0);
            canvas.rotation.set(Math.PI/2, 0, 0);
            mast.add(canvas);

            //SEA
            var sea = new THREE.Group();

            function myFunc( u, v, point )
			{
				var x = 50*(u-0.5);
				var y = 50*(v-0.5);
				var r = Math.sqrt(x*x+y*y);
				var z = Math.cos(2*r)/2;
				
				point.set( x, y, z );
			}
			
			var waves = new THREE.ParametricGeometry( myFunc, 100, 100 );
			var surface = new THREE.Mesh( waves, blue );
            surface.rotation.set(Math.PI/2, Math.PI, Math.PI);
            surface.position.set( 0, -8.5, 0);
            sea.add( surface );


            body.position.set(0, -7, 0);
            scene.add( body );
            scene.add( mast );
            scene.add( sea );


            //LIGHT
            var light = new THREE.PointLight( );
			light.position.set( -20, 20, 10 );
			scene.add( light );

			renderer.render(scene, camera);
		</script>
	</body>
</html>
